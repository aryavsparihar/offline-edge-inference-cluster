name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==$(grep -E '^ruff==' requirements/dev.txt | cut -d= -f3)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU-only torch (avoids multi-GB CUDA wheels)
        run: |
          TORCH=$(grep -E '^torch==' requirements/compress.txt | cut -d= -f3)
          pip install "torch==${TORCH}" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - name: Cache tiny test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ hashFiles('tests/test_compression_e2e.py') }}
      - run: pytest -q --durations=10

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build node image (amd64; arm64 is built the same way with --platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: edgecluster:ci
