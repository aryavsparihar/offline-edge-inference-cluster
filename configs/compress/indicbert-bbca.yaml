# ai4bharat/indic-bert (ALBERT, 33M params). Gated on the Hub: accept its terms and `huggingface-cli login` first.
# ALBERT shares one attention block across all 12 layers, so head pruning removes a head from every layer.
name: indicbert-bbca
base_model: ai4bharat/indic-bert
dataset:
  kind: indic_glue
  config: bbca.hi
  dir: data/public
max_seq_len: 128
finetune:
  epochs: 4
  batch_size: 16
  lr: 3.0e-5
pruning:
  head_ratio: 0.25         # 3 of the 12 shared heads
  ffn_ratio: 0.2
  importance_examples: 346
  recovery_epochs: 1
  recovery_lr: 2.0e-5
quantization:
  per_channel: false
  op_types: [MatMul, Gather]
out_dir: runs/indicbert-bbca
