# XLM-RoBERTa base (278M params, ~1.1 GB fp32 ONNX) on IndicGLUE bbca.hi (BBC Hindi topic classification).
# This is the model whose fp32 size matches the original project's 1.1 GB figure.
name: xlmr-bbca
base_model: FacebookAI/xlm-roberta-base
dataset:
  kind: indic_glue
  config: bbca.hi
  dir: data/public
max_seq_len: 128
finetune:
  epochs: 4
  batch_size: 16
  lr: 3.0e-5
  warmup_ratio: 0.1
pruning:
  head_ratio: 0.3          # fraction of all 144 heads removed (global ranking)
  ffn_ratio: 0.2           # fraction of FFN neurons removed per layer
  importance_examples: 346  # whole validation split
  recovery_epochs: 1
  recovery_lr: 2.0e-5
quantization:
  per_channel: false
  op_types: [MatMul, Gather]
out_dir: runs/xlmr-bbca
