# bert-base-multilingual-cased (178M params, ~0.71 GB fp32 ONNX) on IndicGLUE bbca.hi.
name: mbert-bbca
base_model: google-bert/bert-base-multilingual-cased
dataset:
  kind: indic_glue
  config: bbca.hi
  dir: data/public
max_seq_len: 128
finetune:
  epochs: 4
  batch_size: 16
  lr: 3.0e-5
  warmup_ratio: 0.1
pruning:
  head_ratio: 0.3
  ffn_ratio: 0.2
  importance_examples: 346
  recovery_epochs: 1
  recovery_lr: 2.0e-5
quantization:
  per_channel: false
  op_types: [MatMul, Gather]
out_dir: runs/mbert-bbca
