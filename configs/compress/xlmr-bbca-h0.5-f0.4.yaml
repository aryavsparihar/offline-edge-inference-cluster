# Variant of xlmr-bbca.yaml with more aggressive pruning (same fine-tuned checkpoint).
# This is the model whose fp32 size matches the original project's 1.1 GB figure.
name: xlmr-bbca-h0.5-f0.4
base_model: FacebookAI/xlm-roberta-base
dataset:
  kind: indic_glue
  config: bbca.hi
  dir: data/public
max_seq_len: 128
finetune:
  epochs: 4
  batch_size: 16
  lr: 3.0e-5
  warmup_ratio: 0.1
pruning:
  head_ratio: 0.5
  ffn_ratio: 0.4
  importance_examples: 346  # whole validation split
  recovery_epochs: 1
  recovery_lr: 2.0e-5
quantization:
  per_channel: false
  op_types: [MatMul, Gather]
out_dir: runs/xlmr-bbca-h0.5-f0.4
finetuned_dir: runs/xlmr-bbca/finetuned  # reuse the base run's fine-tuned checkpoint
baseline_onnx_dir: runs/xlmr-bbca/onnx     # and its fp32 / fp32+int8 exports
save_pruned_checkpoint: false
